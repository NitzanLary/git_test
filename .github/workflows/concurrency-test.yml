name: Concurrency Test Example

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# 🔒 Concurrency ensures one run at a time per environment
concurrency:
  group: concurrency-test-${{ github.event.inputs.environment }}
  cancel-in-progress: false   # queue new runs instead of canceling

jobs:
  simulate-work:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Start
        run: echo "🚀 Starting job in ${{ github.event.inputs.environment }}"

      - name: Simulate Work
        run: |
          echo "Running simulated workload for 60 seconds..."
          for i in {1..6}; do
            echo "🕐 Working... $i/6"
            sleep 10
          done

      - name: Finish
        run: echo "✅ Completed job for ${{ github.event.inputs.environment }}"
